<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Page</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .kicker { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    h2 { font-size: 40px; margin-top: 100px; margin-bottom: 16px; }
    .scrolling-list { max-height: 44px; overflow: auto; font-size: 16px; margin: 0; }
    figcaption { font-size: 14px; }
    p { font-size: 18px; }
  </style>
</head>
<body>
  <div class="kicker">REAL KICKER LABEL</div>
  <h2>Section Heading</h2>
  <p>Regular paragraph text.</p>
  
  <ul class="scrolling-list">
    <li>Alpha</li>
    <li>Beta</li>
    <li>Gamma</li>
    <li>Delta</li>
    <li>Epsilon</li>
    <li>Zeta</li>
  </ul>
  <h2>Next Section</h2>
  
  <figure>
    <img src="photo.jpg" alt="" width="600" height="300">
    <figcaption>Members at work.</figcaption>
  </figure>
  <h2>Another Section</h2>
</body>
</html>
